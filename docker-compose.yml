services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-izone_education}"
      POSTGRES_USER: "${POSTGRES_USER:-izone_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - izone-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrator:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-izone_education};Username=${POSTGRES_USER:-izone_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      App__SelfUrl: "${APP_SELF_URL:-http://localhost:8080}"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-izone_education};Username=${POSTGRES_USER:-izone_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      StringEncryption__DefaultPassPhrase: "${STRING_ENCRYPTION_PASSPHRASE:?Set STRING_ENCRYPTION_PASSPHRASE in .env}"
      OpenIddict__CertificatePath: "/app/openiddict.pfx"
      OpenIddict__CertificatePassword: "${OPENIDDICT_CERT_PASSWORD:?Set OPENIDDICT_CERT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets/openiddict.pfx:/app/openiddict.pfx:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  izone-postgres:
