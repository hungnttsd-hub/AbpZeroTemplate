services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-webhoantien}"
      POSTGRES_USER: "${POSTGRES_USER:-webhoantien}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - webhoantien-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrator:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-webhoantien};Username=${POSTGRES_USER:-webhoantien};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      InitialAdmin__Email: "${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in .env}"
      InitialAdmin__Password: "${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      App__SelfUrl: "${APP_SELF_URL:-http://localhost:8080}"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-webhoantien};Username=${POSTGRES_USER:-webhoantien};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      StringEncryption__DefaultPassPhrase: "${STRING_ENCRYPTION_PASSPHRASE:?Set STRING_ENCRYPTION_PASSPHRASE in .env}"
      OpenIddict__CertificatePath: "/app/openiddict.pfx"
      OpenIddict__CertificatePassword: "${OPENIDDICT_CERT_PASSWORD:?Set OPENIDDICT_CERT_PASSWORD in .env}"
      InitialAdmin__Email: "${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in .env}"
      AdminEmail: "${ADMIN_EMAIL:-}"
      Shopee__AffiliateId: "${SHOPEE_AFFILIATE_ID:?Set SHOPEE_AFFILIATE_ID in .env}"
      Shopee__ProductDataEndpoint: "${SHOPEE_PRODUCT_DATA_ENDPOINT:-https://data.addlivetag.com/product-data/product-data.php}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-webHoanTien.com}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets/openiddict.pfx:/app/openiddict.pfx:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  webhoantien-postgres:
