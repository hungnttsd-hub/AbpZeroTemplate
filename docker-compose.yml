services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-AquaGarden_ChangeMe123!}"
    ports:
      - "1433:1433"
    volumes:
      - aquagarden-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrator:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=AbpIoTemplateProject;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AquaGarden_ChangeMe123!};TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      App__SelfUrl: "${APP_SELF_URL:-http://localhost:8080}"
      ConnectionStrings__Default: "Server=sqlserver;Database=AbpIoTemplateProject;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AquaGarden_ChangeMe123!};TrustServerCertificate=True"
      StringEncryption__DefaultPassPhrase: "${STRING_ENCRYPTION_PASSPHRASE:-change-this-production-passphrase}"
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  aquagarden-sql:
