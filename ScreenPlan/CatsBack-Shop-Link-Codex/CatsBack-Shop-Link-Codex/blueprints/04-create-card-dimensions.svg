<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#E04A4A"/></marker>
  <linearGradient id="teal" x1="0" y1="0" x2="360" y2="0"><stop stop-color="#0B9098"/><stop offset="1" stop-color="#10A7A5"/></linearGradient>
</defs>
<rect width="900" height="650" fill="#F7F9FB"/>
<text x="40" y="38" fill="#08254A" font-family="Inter,Arial" font-size="24" font-weight="800">CatsBack create-card blueprint — mobile 390px</text>
<text x="40" y="62" fill="#66758F" font-family="Inter,Arial" font-size="12">Authoritative geometry for Product / Shop selector upgrade</text>

<g transform="translate(70 100)">
  <rect x="0" y="0" width="370" height="310" rx="22" fill="#fff" stroke="#DCE4EE" stroke-width="1.5"/>
  <rect x="15" y="20" width="40" height="40" rx="13" fill="url(#teal)"/>
  <text x="68" y="46" fill="#08254A" font-family="Inter,Arial" font-size="18" font-weight="800">Dán link Shopee tại đây ✦</text>

  <rect x="15.5" y="75.5" width="340" height="43" rx="21.5" fill="#F7F9FB" stroke="#DCE4EE"/>
  <rect x="21" y="79" width="160" height="36" rx="18" fill="url(#teal)"/>
  <text x="64" y="102" fill="#fff" font-family="Inter,Arial" font-size="12" font-weight="700">Link sản phẩm</text>
  <text x="240" y="102" fill="#66758F" font-family="Inter,Arial" font-size="12" font-weight="700">Link shop</text>

  <text x="15" y="142" fill="#7E899A" font-family="Inter,Arial" font-size="10">ⓘ Chọn loại link để hệ thống tạo link hoàn tiền phù hợp.</text>
  <text x="15" y="166" fill="#087C89" font-family="Inter,Arial" font-size="11" font-weight="700">Xem hướng dẫn ›</text>

  <rect x="15.5" y="179.5" width="340" height="54" rx="14" fill="#fff" stroke="#DCE4EE"/>
  <text x="29" y="212" fill="#9AA6B8" font-family="Inter,Arial" font-size="11.5">Dán link sản phẩm Shopee tại đây...</text>

  <rect x="15" y="248" width="340" height="50" rx="14" fill="url(#teal)"/>
  <text x="116" y="279" fill="#fff" font-family="Inter,Arial" font-size="13" font-weight="800">Tạo link hoàn tiền →</text>
</g>

<!-- dimension annotations -->
<g stroke="#E04A4A" stroke-width="1.4" fill="none">
  <line x1="70" y1="430" x2="440" y2="430" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="55" y1="100" x2="55" y2="410" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="455" y1="175" x2="455" y2="218" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="455" y1="279" x2="455" y2="333" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="455" y1="348" x2="455" y2="398" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</g>
<g fill="#C83838" font-family="Inter,Arial" font-size="12" font-weight="700">
  <text x="235" y="451">370px card width inside 390px viewport (10px page gap each side)</text>
  <text x="17" y="270" transform="rotate(-90 17 270)">310px idle card height</text>
  <text x="470" y="199">43px selector</text>
  <text x="470" y="309">54px input</text>
  <text x="470" y="377">50px CTA</text>
</g>

<g transform="translate(520 110)">
  <text x="0" y="0" fill="#08254A" font-family="Inter,Arial" font-size="18" font-weight="800">Design tokens</text>
  <rect x="0" y="24" width="24" height="24" rx="6" fill="#08254A"/><text x="36" y="41" fill="#33435A" font-family="Inter,Arial" font-size="12">#08254A — text/navy</text>
  <rect x="0" y="58" width="24" height="24" rx="6" fill="#0B9098"/><text x="36" y="75" fill="#33435A" font-family="Inter,Arial" font-size="12">#0B9098 — teal active</text>
  <rect x="0" y="92" width="24" height="24" rx="6" fill="#10A7A5"/><text x="36" y="109" fill="#33435A" font-family="Inter,Arial" font-size="12">#10A7A5 — teal gradient</text>
  <rect x="0" y="126" width="24" height="24" rx="6" fill="#DCE4EE"/><text x="36" y="143" fill="#33435A" font-family="Inter,Arial" font-size="12">#DCE4EE — borders</text>
  <rect x="0" y="160" width="24" height="24" rx="6" fill="#66758F"/><text x="36" y="177" fill="#33435A" font-family="Inter,Arial" font-size="12">#66758F — muted</text>
  <rect x="0" y="194" width="24" height="24" rx="6" fill="#FFBD24"/><text x="36" y="211" fill="#33435A" font-family="Inter,Arial" font-size="12">#FFBD24 — Shop CTA</text>

  <text x="0" y="262" fill="#08254A" font-family="Inter,Arial" font-size="16" font-weight="800">Spacing</text>
  <text x="0" y="288" fill="#66758F" font-family="Inter,Arial" font-size="12">Card radius: 22px</text>
  <text x="0" y="310" fill="#66758F" font-family="Inter,Arial" font-size="12">Input radius: 14px</text>
  <text x="0" y="332" fill="#66758F" font-family="Inter,Arial" font-size="12">CTA radius: 14px</text>
  <text x="0" y="354" fill="#66758F" font-family="Inter,Arial" font-size="12">Selector radius: 999px</text>
  <text x="0" y="376" fill="#66758F" font-family="Inter,Arial" font-size="12">Card side padding: 14–15px</text>
</g>
</svg>