<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420">
<rect width="1160" height="420" fill="#F7F9FC"/>
<text x="28" y="42" font-family="Inter,Arial" font-size="24" font-weight="800" fill="#08254A">Modal variants blueprint</text>

<!-- Warning -->
<g transform="translate(28,80)">
  <rect width="340" height="280" rx="24" fill="#fff" stroke="#E6ECF3"/>
  <circle cx="170" cy="58" r="28" fill="#FCE8E6"/>
  <path d="M170 40 186 68H154L170 40Z" fill="#FF4B47"/>
  <text x="170" y="120" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#08254A">Xóa thông báo?</text>
  <text x="170" y="150" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#66758F">Bạn có chắc chắn muốn xóa thông báo này?</text>
  <rect x="22" y="206" width="140" height="46" rx="23" fill="#fff" stroke="#08254A"/>
  <rect x="178" y="206" width="140" height="46" rx="23" fill="#FF4B47"/>
  <text x="92" y="235" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#08254A">Hủy</text>
  <text x="248" y="235" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">Xóa</text>
</g>

<!-- Success -->
<g transform="translate(408,80)">
  <rect width="340" height="280" rx="24" fill="#fff" stroke="#E6ECF3"/>
  <circle cx="170" cy="58" r="28" fill="#DDF6EC"/>
  <circle cx="170" cy="58" r="16" stroke="#12A56C" stroke-width="2.2"/>
  <path d="m162 58 5 5 10-12" stroke="#12A56C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="120" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#08254A">Đã xóa thành công!</text>
  <text x="170" y="150" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#66758F">Thông báo đã được xóa khỏi hệ thống.</text>
  <rect x="22" y="206" width="296" height="46" rx="23" fill="#0B9098"/>
  <text x="170" y="235" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">Đóng</text>
</g>

<!-- Info -->
<g transform="translate(788,80)">
  <rect width="340" height="280" rx="24" fill="#fff" stroke="#E6ECF3"/>
  <circle cx="170" cy="58" r="28" fill="#E6F0FF"/>
  <circle cx="170" cy="58" r="16" stroke="#2563EB" stroke-width="2.2"/>
  <path d="M170 54v10" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="170" cy="48" r="1.8" fill="#2563EB"/>
  <text x="170" y="120" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#08254A">Thông tin</text>
  <text x="170" y="150" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#66758F">Đây là nội dung thông tin hoặc hướng dẫn.</text>
  <rect x="22" y="206" width="296" height="46" rx="23" fill="#2563EB"/>
  <text x="170" y="235" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">Đã hiểu</text>
</g>
</svg>
