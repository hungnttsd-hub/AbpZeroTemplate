<text x="684" y="295" font-size="13" font-family="Inter, Arial" fill="#6F8BAA">Large soft waves for the page header / section headers.</text>
<rect x="36" y="344" width="1128" height="132" rx="24" fill="#FFFFFF" stroke="#D7EDF4"/>
<text x="60" y="380" font-size="16" font-family="Inter, Arial" font-weight="700" fill="#123C74">Recommended shadows</text>
