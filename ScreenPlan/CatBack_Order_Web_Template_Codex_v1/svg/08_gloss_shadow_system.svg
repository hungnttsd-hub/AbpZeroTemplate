<rect width="1200" height="520" rx="24" fill="#F4FDFF"/>
<text x="36" y="52" font-size="28" font-family="Inter, Arial" font-weight="800" fill="#123C74">Gloss and Shadow System</text>
<text x="36" y="82" font-size="16" font-family="Inter, Arial" fill="#6F8BAA">Use these visual rules consistently across the order page implementation.</text>
