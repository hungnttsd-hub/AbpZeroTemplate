<text x="36" y="272" font-size="15" font-family="Inter, Arial" font-weight="700" fill="#123C74">Active pill / active nav style</text>
<text x="36" y="295" font-size="13" font-family="Inter, Arial" fill="#6F8BAA">Gradient + strong glow + top gloss overlay.</text>
<g filter="url(#shadow2)"><rect x="360" y="128" width="280" height="116" rx="24" fill="#FFFFFF" stroke="#D7EDF4"/><rect x="372" y="140" width="256" height="34" rx="17" fill="url(#g2)" opacity="0.75"/></g>
<text x="360" y="272" font-size="15" font-family="Inter, Arial" font-weight="700" fill="#123C74">White card style</text>
<text x="360" y="295" font-size="13" font-family="Inter, Arial" fill="#6F8BAA">Thin border + soft shadow + subtle gloss cap.</text>
<g filter="url(#shadow2)"><rect x="684" y="128" width="280" height="116" rx="24" fill="#EAFBFF"/><path d="M698 154C745 128 808 137 852 160C900 184 938 191 952 188V244H684V128Z" fill="#FFFFFF" opacity="0.36"/></g>
