<svg xmlns="http://www.w3.org/2000/svg" width="390" height="200" viewBox="0 0 390 200" fill="none">
  <defs>
    <linearGradient id="gradHeader" x1="0" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#063B68"/>
      <stop offset="1" stop-color="#07527E"/>
    </linearGradient>
    <linearGradient id="gradTeal" x1="16" y1="0" x2="374" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0BA5A4"/>
      <stop offset="1" stop-color="#12B8B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#063B68" flood-opacity="0.06"/>
    </filter>
    <style>
      .t{font-family:Inter, Arial, sans-serif; fill:#0B2747}
      .muted{fill:#5B6C82}
      .ter{fill:#8C9AAD}
      .teal{fill:#0BA5A4}
      .white{fill:#fff}
      .h1{font-size:18px;font-weight:700}
      .h2{font-size:16px;font-weight:700}
      .h3{font-size:14px;font-weight:700}
      .b{font-size:13px;font-weight:400}
      .s{font-size:12px;font-weight:400}
      .sm{font-size:11px;font-weight:600}
    </style>
  </defs>
  <rect width="390" height="200" fill="#F5F9FC"/><rect x="16" y="16" width="358" height="168" rx="18" fill="#fff" stroke="#DDE7EE"/><text x="32" y="42" class="t h3">Các bước chính</text><circle cx="40" cy="68" r="10" fill="#E7F7F6"/><text x="37" y="72" class="t sm teal">1</text><text x="60" y="72" class="t s">Ví dụ bước đầu tiên để thao tác.</text><circle cx="40" cy="98" r="10" fill="#E7F7F6"/><text x="37" y="102" class="t sm teal">2</text><text x="60" y="102" class="t s">Ví dụ bước thứ hai.</text><circle cx="40" cy="128" r="10" fill="#E7F7F6"/><text x="37" y="132" class="t sm teal">3</text><text x="60" y="132" class="t s">Ví dụ bước thứ ba.</text><circle cx="40" cy="158" r="10" fill="#E7F7F6"/><text x="37" y="162" class="t sm teal">4</text><text x="60" y="162" class="t s">Ví dụ bước thứ tư.</text>
</svg>